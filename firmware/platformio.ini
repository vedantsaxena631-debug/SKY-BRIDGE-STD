; PlatformIO Project Configuration File for SkyBridge ESP32 + SX1278 Nodes
; Supports 3 target environments from a single unified codebase:
;   - team_a (Ground Node A with OLED, Buttons, Buzzer)
;   - team_b (Ground Node B with OLED, Buttons, Buzzer)
;   - drone_relay (Airborne LoRa Repeater with Status LED)

[platformio]
default_envs = team_a

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
    thomasfredericks/Bounce2@^2.71

; -------------------------------------------------------------
; Environment: Team A (Ground Base Station - Serial Gateway)
; -------------------------------------------------------------
[env:team_a]
build_flags = 
    -DTHIS_NODE_ROLE=0
    -DNODE_CALLSIGN=\"TEAM_A\"
    -DSERIAL_BAUD=115200

; -------------------------------------------------------------
; Environment: Team B (Ground Search Station)
; -------------------------------------------------------------
[env:team_b]
build_flags = 
    -DTHIS_NODE_ROLE=1
    -DNODE_CALLSIGN=\"TEAM_B\"
    -DSERIAL_BAUD=115200

; -------------------------------------------------------------
; Environment: Drone Relay (Airborne Store-and-Forward Repeater)
; -------------------------------------------------------------
[env:drone_relay]
build_flags = 
    -DTHIS_NODE_ROLE=2
    -DNODE_CALLSIGN=\"DRONE\"
    -DSERIAL_BAUD=115200
